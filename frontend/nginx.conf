# nginx serves the built SPA. The stock image does not fall back to index.html,
# so a deep link or a refresh on any client-side route (/settings, /runs, ...)
# would answer 404 from the filesystem even though the app owns that path.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite writes content-hashed filenames, so these can be cached hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_connect_timeout 10s;
        client_max_body_size 256k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
