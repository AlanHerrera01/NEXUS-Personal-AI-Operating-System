# nginx serves the built SPA. The stock image does not fall back to index.html,
# so a deep link or a refresh on any client-side route (/settings, /runs, ...)
# would answer 404 from the filesystem even though the app owns that path.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite writes content-hashed filenames, so these can be cached hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API is called directly at http://localhost:8000 (see the frontend's
    # VITE_API_BASE_URL default), so there is deliberately no /api proxy here:
    # adding one would put a second, silently different route to the backend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
